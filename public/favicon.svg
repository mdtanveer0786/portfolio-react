<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Inner shadow/shine -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Code brackets </> with glow -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M 195 170 L 105 256 L 195 342" fill="none" stroke="url(#code)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right bracket > -->
    <path d="M 317 170 L 407 256 L 317 342" fill="none" stroke="url(#code)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <line x1="280" y1="145" x2="232" y2="367" stroke="url(#code)" stroke-width="32" stroke-linecap="round"/>
  </g>
  <!-- Small decorative dots -->
  <circle cx="100" cy="100" r="8" fill="rgba(196,181,253,0.5)"/>
  <circle cx="412" cy="100" r="6" fill="rgba(196,181,253,0.3)"/>
  <circle cx="412" cy="412" r="10" fill="rgba(196,181,253,0.4)"/>
  <circle cx="100" cy="412" r="5" fill="rgba(196,181,253,0.25)"/>
</svg>
